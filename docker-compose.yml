services:
  saleor-paper:
    container_name: saleor-paper
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
        NEXT_PUBLIC_DEFAULT_CHANNEL: ${NEXT_PUBLIC_DEFAULT_CHANNEL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    networks:
      - paper-internal
      - arena-shared

networks:
  paper-internal:
    name: paper-internal
    driver: bridge

  arena-shared:
    external: true
